[package]
name = "scry"
version = "0.1.0"
edition = "2024"
description = "Find the parts of a codebase most likely to need refactoring or to hide bugs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
petgraph = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
toml = "1.1.6"

[profile.release]
lto = "thin"
codegen-units = 4
